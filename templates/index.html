<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fiyat Karşılaştır">
<title>⚡ Fiyat Karşılaştırma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF6000;
    --orange-dark: #CC4C00;
    --green: #00A650;
    --bg: #F3F3F3;
    --card: #FFFFFF;
    --border: #E8E8E8;
    --text: #1D1D1D;
    --muted: #888;
    --fav: #FF3B3B;
    --site-direnc: #E53935;
    --site-robotistan: #1976D2;
    --site-robolinkmarket: #388E3C;
    --site-robocombo: #7B1FA2;
    --site-motorobit: #F57C00;
    --radius: 14px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 600px;
    margin: 0 auto;
  }
  .header {
    background: var(--orange);
    padding: 14px 16px 10px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(255,96,0,0.3);
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .header h1 { color: white; font-size: 19px; font-weight: 900; letter-spacing: -0.3px; }
  .fav-count { color: white; font-size: 13px; font-weight: 700; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 20px; }
  .search-row { display: flex; gap: 8px; }
  .search-input { flex: 1; padding: 10px 14px; border-radius: 10px; border: none; font-size: 15px; font-family: 'Nunito', sans-serif; font-weight: 600; outline: none; background: white; color: var(--text); }
  .search-input::placeholder { color: #aaa; font-weight: 600; }
  .search-btn { padding: 10px 18px; background: var(--orange-dark); color: white; border: none; border-radius: 10px; font-size: 14px; font-family: 'Nunito', sans-serif; font-weight: 800; cursor: pointer; white-space: nowrap; transition: background 0.15s; -webkit-appearance: none; }
  .search-btn:active { background: #993a00; }
  .filters { background: white; padding: 10px 16px; border-bottom: 1px solid var(--border); overflow-x: auto; display: flex; gap: 6px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filter-chip { display: flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; border: 2px solid transparent; white-space: nowrap; user-select: none; transition: opacity 0.15s; -webkit-appearance: none; }
  .filter-chip input { display: none; }
  .filter-chip.checked { opacity: 1; color: white; }
  .filter-chip.unchecked { opacity: 0.45; background: #f0f0f0 !important; color: #555; }
  .chip-direnc { background: var(--site-direnc); color: white; }
  .chip-robotistan { background: var(--site-robotistan); color: white; }
  .chip-robolinkmarket { background: var(--site-robolinkmarket); color: white; }
  .chip-motorobit { background: var(--site-motorobit); color: white; }
  .tabs { display: flex; background: white; border-bottom: 2px solid var(--border); }
  .tab { flex: 1; padding: 12px; text-align: center; font-size: 14px; font-weight: 800; cursor: pointer; border: none; background: none; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.15s; font-family: 'Nunito', sans-serif; -webkit-appearance: none; }
  .tab.active { color: var(--orange); border-bottom-color: var(--orange); }
  .toolbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: #FAFAFA; border-bottom: 1px solid var(--border); }
  .status-text { font-size: 12px; color: var(--muted); font-weight: 600; }
  .sort-select { font-size: 12px; font-family: 'Nunito', sans-serif; font-weight: 700; border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; background: white; color: var(--text); cursor: pointer; outline: none; }
  .progress-bar { height: 3px; background: var(--border); display: none; }
  .progress-bar.loading { display: block; background: linear-gradient(90deg, var(--orange) 0%, #ffb347 50%, var(--orange) 100%); background-size: 200% 100%; animation: progress-anim 1.2s infinite; }
  @keyframes progress-anim { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .cards-container { padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  @media (max-width: 380px) { .cards-container { grid-template-columns: repeat(2, 1fr); } }
  .card { background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; position: relative; border: 1.5px solid var(--border); display: flex; flex-direction: column; }
  .card:active { transform: scale(0.97); }
  .card-img-wrap { position: relative; width: 100%; padding-bottom: 75%; background: #f8f8f8; overflow: hidden; }
  .card-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 8px; }
  .card-img-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #ccc; font-size: 28px; }
  .fav-btn { position: absolute; top: 6px; right: 6px; background: white; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,0.15); z-index: 2; -webkit-appearance: none; transition: transform 0.15s; }
  .fav-btn:active { transform: scale(1.25); }
  .fav-btn.active { color: var(--fav); }
  .fav-btn:not(.active) { color: #ccc; }
  .card-body { padding: 8px 10px 10px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .site-badge { display: inline-block; font-size: 10px; font-weight: 800; color: white; padding: 2px 7px; border-radius: 4px; width: fit-content; }
  .card-name { font-size: 12px; font-weight: 700; color: var(--text); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
  .card-price-row { display: flex; align-items: center; gap: 5px; margin-top: 4px; }
  .card-price { font-size: 15px; font-weight: 900; color: var(--orange); }
  .card-price.cheapest { color: var(--green); }
  .cheapest-badge { font-size: 9px; font-weight: 800; background: var(--green); color: white; padding: 1px 5px; border-radius: 4px; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state h3 { font-size: 16px; font-weight: 800; margin-bottom: 6px; color: #555; }
  .empty-state p { font-size: 13px; line-height: 1.5; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>⚡ Fiyat Karşılaştırma</h1>
    <span class="fav-count hidden" id="favCount"></span>
  </div>
  <div class="search-row">
    <input type="text" class="search-input" id="searchInput" placeholder="Ürün ara… (arduino, led, sensor)" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="search-btn" id="searchBtn" onclick="aramaYap()">Ara</button>
  </div>
</div>

<div class="filters" id="filtersRow">
  <label class="filter-chip chip-direnc checked" id="chip-direnc.net">
    <input type="checkbox" checked> direnc.net
  </label>
  <label class="filter-chip chip-robotistan checked" id="chip-robotistan.com">
    <input type="checkbox" checked> robotistan.com
  </label>
  <label class="filter-chip chip-robolinkmarket checked" id="chip-robolinkmarket.com">
    <input type="checkbox" checked> robolinkmarket.com
  </label>
  <label class="filter-chip chip-motorobit checked" id="chip-motorobit.com">
    <input type="checkbox" checked> motorobit.com
  </label>
</div>

<div class="tabs">
  <button class="tab active" id="tabArama" onclick="sekmeDegistir('arama')">🔍 Arama</button>
  <button class="tab" id="tabFavoriler" onclick="sekmeDegistir('favoriler')">♥ Favorilerim</button>
</div>

<div class="toolbar">
  <span class="status-text" id="statusText">Ürün adı girerek arama yapın</span>
  <select class="sort-select" id="sortSelect" onchange="siralaVeGoster()">
    <option value="fiyat_asc">Fiyat ↑</option>
    <option value="fiyat_desc">Fiyat ↓</option>
    <option value="site">Site</option>
  </select>
</div>

<div class="progress-bar" id="progressBar"></div>

<div id="aramaSection">
  <div class="cards-container" id="aramaGrid"></div>
  <div class="empty-state" id="aramaEmpty">
    <div class="icon">🔍</div>
    <h3>Aramaya hazır</h3>
    <p>Arduino, LED, sensör gibi<br>elektronik ürünleri karşılaştırın</p>
  </div>
</div>

<div id="favorilerSection" class="hidden">
  <div class="cards-container" id="favGrid"></div>
  <div class="empty-state hidden" id="favEmpty">
    <div class="icon">♡</div>
    <h3>Favori yok</h3>
    <p>Ürün kartlarındaki kalp ikonuna<br>tıklayarak favorilere ekleyebilirsiniz</p>
  </div>
</div>

<script>
let sonuclar = [];
let aktifSekme = 'arama';
let favoriMap = {};

const SITE_RENK = {
  'direnc.net': '#E53935',
  'robotistan.com': '#1976D2',
  'robolinkmarket.com': '#388E3C',
  'robocombo.com': '#7B1FA2',
  'motorobit.com': '#F57C00',
};

function proxyImg(url) {
  if (!url) return '';
  return '/proxy/img?url=' + encodeURIComponent(url);
}

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') aramaYap();
});

document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const cb = chip.querySelector('input');
    cb.checked = !cb.checked;
    chip.classList.toggle('checked', cb.checked);
    chip.classList.toggle('unchecked', !cb.checked);
  });
});

function seciliSiteler() {
  return [...document.querySelectorAll('.filter-chip input:checked')]
    .map(cb => cb.closest('.filter-chip').id.replace('chip-', ''));
}

async function aramaYap() {
  const kelime = document.getElementById('searchInput').value.trim();
  if (!kelime) return;
  const siteler = seciliSiteler();
  if (siteler.length === 0) { alert('En az bir site seçin!'); return; }
  sekmeDegistir('arama');
  document.getElementById('aramaGrid').innerHTML = '';
  document.getElementById('aramaEmpty').classList.add('hidden');
  document.getElementById('progressBar').classList.add('loading');
  document.getElementById('statusText').textContent = `"${kelime}" aranıyor…`;
  document.getElementById('searchBtn').disabled = true;
  try {
    const params = new URLSearchParams({ q: kelime });
    siteler.forEach(s => params.append('siteler', s));
    const res = await fetch(`/api/ara?${params}`);
    sonuclar = await res.json();
    await favoriDurumlariniYukle();
    const gercek = sonuclar.filter(r => r.fiyat != null);
    document.getElementById('statusText').textContent =
      `${gercek.length} ürün bulundu (${sonuclar.length} toplam)`;
  } catch(e) {
    sonuclar = [];
    document.getElementById('statusText').textContent = 'Hata oluştu';
  } finally {
    document.getElementById('progressBar').classList.remove('loading');
    document.getElementById('searchBtn').disabled = false;
    siralaVeGoster();
  }
}

function siralaVeGoster() {
  const sort = document.getElementById('sortSelect').value;
  let sirali = [...sonuclar];
  if (sort === 'fiyat_asc') {
    sirali.sort((a, b) => (a.fiyat ?? Infinity) - (b.fiyat ?? Infinity));
  } else if (sort === 'fiyat_desc') {
    sirali.sort((a, b) => (b.fiyat ?? -1) - (a.fiyat ?? -1));
  } else {
    sirali.sort((a, b) => a.site.localeCompare(b.site));
  }
  renderGrid(document.getElementById('aramaGrid'), sirali, 'aramaEmpty');
}

function renderGrid(grid, urunler, emptyId) {
  grid.innerHTML = '';
  if (!urunler.length) {
    document.getElementById(emptyId).classList.remove('hidden');
    return;
  }
  document.getElementById(emptyId).classList.add('hidden');
  const fiyatlar = urunler.map(r => r.fiyat).filter(f => f != null);
  const enUcuz = fiyatlar.length ? Math.min(...fiyatlar) : null;
  urunler.forEach(urun => {
    const kid = urunId(urun);
    const isFav = !!favoriMap[kid];
    const isEnUcuz = urun.fiyat != null && urun.fiyat === enUcuz;
    const renk = SITE_RENK[urun.site] || '#888';
    const imgSrc = proxyImg(urun.img_url);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-img-wrap">
        ${imgSrc ? `<img class="card-img" src="${imgSrc}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
        <div class="card-img-placeholder" style="${imgSrc ? 'display:none' : ''}">📦</div>
        <button class="fav-btn ${isFav ? 'active' : ''}" data-kid="${kid}" onclick="toggleFav(event, ${JSON.stringify(urun).replace(/"/g, '&quot;')})">
          ${isFav ? '♥' : '♡'}
        </button>
      </div>
      <div class="card-body">
        <span class="site-badge" style="background:${renk}">${urun.site}</span>
        <div class="card-name">${urun.isim}</div>
        <div class="card-price-row">
          <span class="card-price ${isEnUcuz ? 'cheapest' : ''}">${urun.fiyat_metin || '—'}</span>
          ${isEnUcuz ? '<span class="cheapest-badge">EN UCUZ</span>' : ''}
        </div>
      </div>
    `;
    if (urun.url && urun.url.startsWith('http')) {
      card.addEventListener('click', e => {
        if (e.target.closest('.fav-btn')) return;
        window.open(urun.url, '_blank');
      });
    }
    grid.appendChild(card);
  });
}

async function favoriDurumlariniYukle() {
  try {
    const res = await fetch('/api/favoriler');
    const favList = await res.json();
    favoriMap = {};
    favList.forEach(f => { favoriMap[urunId(f)] = f; });
  } catch(e) {}
}

async function toggleFav(e, urun) {
  e.stopPropagation();
  const kid = urunId(urun);
  const btn = e.currentTarget;
  if (favoriMap[kid]) {
    await fetch(`/api/favoriler/${kid}`, { method: 'DELETE' });
    delete favoriMap[kid];
    btn.textContent = '♡';
    btn.classList.remove('active');
  } else {
    await fetch('/api/favoriler', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(urun)
    });
    favoriMap[kid] = urun;
    btn.textContent = '♥';
    btn.classList.add('active');
  }
  guncelFavSayac();
  if (aktifSekme === 'favoriler') favoriGoster();
}

function urunId(urun) {
  const key = urun.url || (urun.site + urun.isim);
  return btoa(encodeURIComponent(key)).replace(/[^a-zA-Z0-9]/g, '').substring(0, 32);
}

function guncelFavSayac() {
  const n = Object.keys(favoriMap).length;
  const el = document.getElementById('favCount');
  if (n > 0) {
    el.textContent = `♥ ${n}`;
    el.classList.remove('hidden');
  } else {
    el.classList.add('hidden');
  }
}

async function favoriGoster() {
  await favoriDurumlariniYukle();
  try {
    const res = await fetch('/api/favoriler');
    const favList = await res.json();
    document.getElementById('statusText').textContent =
      favList.length ? `${favList.length} favori ürün` : 'Henüz favori eklemediniz';
    renderGrid(document.getElementById('favGrid'), favList, 'favEmpty');
  } catch(e) {}
}

function sekmeDegistir(sekme) {
  aktifSekme = sekme;
  document.getElementById('tabArama').classList.toggle('active', sekme === 'arama');
  document.getElementById('tabFavoriler').classList.toggle('active', sekme === 'favoriler');
  document.getElementById('aramaSection').classList.toggle('hidden', sekme !== 'arama');
  document.getElementById('favorilerSection').classList.toggle('hidden', sekme !== 'favoriler');
  if (sekme === 'favoriler') favoriGoster();
}

(async () => {
  await favoriDurumlariniYukle();
  guncelFavSayac();
})();
</script>
</body>
</html>
