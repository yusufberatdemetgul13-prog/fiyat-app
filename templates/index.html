<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>⚡ Fiyat Karşılaştırma</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* (Aynı CSS'i kullanabilirsiniz; uzun olduğu için burada kısalttım. Üstteki orijinal CSS'i olduğu gibi koyun.) */
:root{--orange:#FF6000;--bg:#F3F3F3;--card:#fff;--border:#E8E8E8;--text:#1D1D1D;--muted:#888;--fav:#FF3B3B;--radius:14px;--shadow:0 2px 12px rgba(0,0,0,0.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:600px;margin:0 auto}
.header{background:var(--orange);padding:14px 16px 10px;position:sticky;top:0;z-index:100}
.header h1{color:#fff;font-size:19px;font-weight:900}
.search-row{display:flex;gap:8px}
.search-input{flex:1;padding:10px 14px;border-radius:10px;border:none;font-size:15px;background:#fff}
.search-btn{padding:10px 18px;background:#CC4C00;color:#fff;border:none;border-radius:10px;font-weight:800;cursor:pointer}
.filters{background:#fff;padding:10px 16px;border-bottom:1px solid var(--border);display:flex;gap:6px;overflow-x:auto}
.filter-chip{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid transparent;white-space:nowrap}
.filter-chip.checked{opacity:1;color:#fff}
.filter-chip.unchecked{opacity:0.45;background:#f0f0f0;color:#555}
.chip-direnc{background:#E53935;color:#fff}
.chip-robotistan{background:#1976D2;color:#fff}
.chip-robolinkmarket{background:#388E3C;color:#fff}
.chip-robocombo{background:#7B1FA2;color:#fff}
.chip-motorobit{background:#F57C00;color:#fff}
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--border)}
.tab{flex:1;padding:12px;text-align:center;font-weight:800;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent}
.tab.active{color:var(--orange);border-bottom-color:var(--orange)}
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:#FAFAFA;border-bottom:1px solid var(--border)}
.status-text{font-size:12px;color:var(--muted);font-weight:600}
.cards-container{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;border:1.5px solid var(--border);display:flex;flex-direction:column}
.card-img-wrap{position:relative;width:100%;padding-bottom:75%;background:#f8f8f8;overflow:hidden}
.card-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px}
.card-img-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:28px}
.fav-btn{position:absolute;top:6px;right:6px;background:white;border:none;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,0.15);z-index:2}
.fav-btn.active{color:var(--fav)}
.card-body{padding:8px 10px 10px;flex:1;display:flex;flex-direction:column;gap:4px}
.site-badge{display:inline-block;font-size:10px;font-weight:800;color:#fff;padding:2px 7px;border-radius:4px}
.card-name{font-size:12px;font-weight:700;color:var(--text);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.card-price{font-size:15px;font-weight:900;color:var(--orange)}
.card-price.cheapest{color:#00A650}
.cheapest-badge{font-size:9px;font-weight:800;background:#00A650;color:#fff;padding:1px 5px;border-radius:4px}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <h1>⚡ Fiyat Karşılaştırma</h1>
    <span id="favCount" class="hidden"></span>
  </div>
  <div class="search-row" style="margin-top:8px">
    <input id="searchInput" class="search-input" placeholder="Ürün ara… (arduino, led, sensor)" autocomplete="off">
    <button id="searchBtn" class="search-btn">Ara</button>
  </div>
</div>

<div class="filters" id="filtersRow">
  <label class="filter-chip chip-direnc checked" id="chip-direnc.net"><input type="checkbox" checked> direnc.net</label>
  <label class="filter-chip chip-robotistan checked" id="chip-robotistan.com"><input type="checkbox" checked> robotistan.com</label>
  <label class="filter-chip chip-robolinkmarket checked" id="chip-robolinkmarket.com"><input type="checkbox" checked> robolinkmarket.com</label>
  <label class="filter-chip chip-robocombo checked" id="chip-robocombo.com"><input type="checkbox" checked> robocombo.com</label>
  <label class="filter-chip chip-motorobit checked" id="chip-motorobit.com"><input type="checkbox" checked> motorobit.com</label>
</div>

<div class="tabs">
  <button class="tab active" id="tabArama">🔍 Arama</button>
  <button class="tab" id="tabFavoriler">♥ Favorilerim</button>
</div>

<div class="toolbar">
  <span class="status-text" id="statusText">Ürün adı girerek arama yapın</span>
  <select id="sortSelect" class="sort-select" style="padding:6px;border-radius:8px;border:1px solid #e8e8e8;font-weight:700">
    <option value="fiyat_asc">Fiyat ↑</option>
    <option value="fiyat_desc">Fiyat ↓</option>
    <option value="site">Site</option>
  </select>
</div>

<div id="aramaSection">
  <div class="cards-container" id="aramaGrid"></div>
  <div class="empty-state" id="aramaEmpty">
    <div class="icon">🔍</div>
    <h3>Aramaya hazır</h3>
    <p>Arduino, LED, sensör gibi<br>elektronik ürünleri karşılaştırın</p>
  </div>
</div>

<div id="favorilerSection" class="hidden">
  <div class="cards-container" id="favGrid"></div>
  <div class="empty-state hidden" id="favEmpty">
    <div class="icon">♡</div>
    <h3>Favori yok</h3>
    <p>Ürün kartlarındaki kalp ikonuna<br>tıklayarak favorilere ekleyebilirsiniz</p>
  </div>
</div>

<script>
/* Utility: deviceId oluşturma / alma */
function getOrCreateDeviceId() {
  let id = localStorage.getItem('deviceId');
  if (!id) {
    // güvenli rastgele id
    const arr = new Uint8Array(16);
    crypto.getRandomValues(arr);
    id = Array.from(arr).map(b => b.toString(16).padStart(2,'0')).join('');
    localStorage.setItem('deviceId', id);
  }
  return id;
}
const DEVICE_ID = getOrCreateDeviceId();

/* Global state */
let sonuclar = [];
let favoriMap = {}; // key -> fav obj
let aktifSekme = 'arama';

const SITE_RENK = {
  'direnc.net': '#E53935',
  'robotistan.com': '#1976D2',
  'robolinkmarket.com': '#388E3C',
  'robocombo.com': '#7B1FA2',
  'motorobit.com': '#F57C00',
};

/* Event bağlama */
document.getElementById('searchBtn').addEventListener('click', aramaYap);
document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') aramaYap(); });
document.getElementById('tabArama').addEventListener('click', () => sekmeDegistir('arama'));
document.getElementById('tabFavoriler').addEventListener('click', () => sekmeDegistir('favoriler'));

document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const cb = chip.querySelector('input');
    cb.checked = !cb.checked;
    chip.classList.toggle('checked', cb.checked);
    chip.classList.toggle('unchecked', !cb.checked);
  });
});

function seciliSiteler() {
  return [...document.querySelectorAll('.filter-chip input:checked')]
    .map(cb => cb.closest('.filter-chip').id.replace('chip-', ''));
}

/* API çağrıları */
async function aramaYap() {
  const kelime = document.getElementById('searchInput').value.trim();
  if (!kelime) return;
  const siteler = seciliSiteler();
  if (siteler.length === 0) { alert('En az bir site seçin!'); return; }
  sekmeDegistir('arama');
  document.getElementById('aramaGrid').innerHTML = '';
  document.getElementById('aramaEmpty').classList.add('hidden');
  document.getElementById('statusText').textContent = `"${kelime}" aranıyor…`;
  document.getElementById('searchBtn').disabled = true;
  try {
    const params = new URLSearchParams({ q: kelime });
    siteler.forEach(s => params.append('siteler', s));
    const res = await fetch(`/api/ara?${params.toString()}`);
    sonuclar = await res.json();
    await favoriDurumlariniYukle();
    const gercek = sonuclar.filter(r => r.fiyat != null);
    document.getElementById('statusText').textContent = `${gercek.length} ürün bulundu (${sonuclar.length} toplam)`;
  } catch(e) {
    console.error(e);
    sonuclar = [];
    document.getElementById('statusText').textContent = 'Hata oluştu';
  } finally {
    document.getElementById('searchBtn').disabled = false;
    siralaVeGoster();
  }
}

function siralaVeGoster() {
  const sort = document.getElementById('sortSelect').value;
  let sirali = [...sonuclar];
  if (sort === 'fiyat_asc') {
    sirali.sort((a, b) => (a.fiyat ?? Infinity) - (b.fiyat ?? Infinity));
  } else if (sort === 'fiyat_desc') {
    sirali.sort((a, b) => (b.fiyat ?? -1) - (a.fiyat ?? -1));
  } else {
    sirali.sort((a, b) => a.site.localeCompare(b.site));
  }
  renderGrid(document.getElementById('aramaGrid'), sirali, 'aramaEmpty');
}

function proxyImg(url) {
  if (!url) return '';
  return '/proxy/img?url=' + encodeURIComponent(url);
}

/* Favori yükle (cihaz bazlı) */
async function favoriDurumlariniYukle() {
  try {
    const res = await fetch(`/api/favoriler?device_id=${DEVICE_ID}`);
    const favList = await res.json();
    favoriMap = {};
    favList.forEach(f => {
      const key = f.url || (f.site + f.isim);
      favoriMap[key] = f;
    });
    guncelFavSayac();
  } catch(e) {
    console.error(e);
    favoriMap = {};
  }
}

/* Grid render (güvenli, inline JSON yok) */
function renderGrid(grid, urunler, emptyId) {
  grid.innerHTML = '';
  if (!urunler.length) {
    document.getElementById(emptyId).classList.remove('hidden');
    return;
  }
  document.getElementById(emptyId).classList.add('hidden');
  const fiyatlar = urunler.map(r => r.fiyat).filter(f => f != null);
  const enUcuz = fiyatlar.length ? Math.min(...fiyatlar) : null;

  urunler.forEach(urun => {
    const key = urun.url || (urun.site + urun.isim);
    const isFav = !!favoriMap[key];
    const isEnUcuz = urun.fiyat != null && urun.fiyat === enUcuz;
    const renk = SITE_RENK[urun.site] || '#888';
    const imgSrc = proxyImg(urun.img_url);

    const card = document.createElement('div');
    card.className = 'card';

    const imgWrap = document.createElement('div');
    imgWrap.className = 'card-img-wrap';

    if (imgSrc) {
      const img = document.createElement('img');
      img.className = 'card-img';
      img.src = imgSrc;
      img.loading = 'lazy';
      img.onerror = function(){ this.style.display='none'; placeholder.style.display='flex'; };
      imgWrap.appendChild(img);
    }
    const placeholder = document.createElement('div');
    placeholder.className = 'card-img-placeholder';
    if (imgSrc) placeholder.style.display = 'none';
    placeholder.textContent = '📦';
    imgWrap.appendChild(placeholder);

    const favBtn = document.createElement('button');
    favBtn.className = 'fav-btn' + (isFav ? ' active' : '');
    favBtn.dataset.key = key;
    favBtn.dataset.urun = encodeURIComponent(JSON.stringify(urun));
    favBtn.textContent = isFav ? '♥' : '♡';
    favBtn.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const u = JSON.parse(decodeURIComponent(ev.currentTarget.dataset.urun));
      await toggleFav(ev.currentTarget, u);
    });
    imgWrap.appendChild(favBtn);

    const body = document.createElement('div');
    body.className = 'card-body';
    const badge = document.createElement('span');
    badge.className = 'site-badge';
    badge.style.background = renk;
    badge.textContent = urun.site;
    const name = document.createElement('div');
    name.className = 'card-name';
    name.textContent = urun.isim;
    const priceRow = document.createElement('div');
    priceRow.className = 'card-price-row';
    const price = document.createElement('span');
    price.className = 'card-price' + (isEnUcuz ? ' cheapest' : '');
    price.textContent = urun.fiyat_metin || '—';
    priceRow.appendChild(price);
    if (isEnUcuz) {
      const badge2 = document.createElement('span');
      badge2.className = 'cheapest-badge';
      badge2.textContent = 'EN UCUZ';
      priceRow.appendChild(badge2);
    }

    body.appendChild(badge);
    body.appendChild(name);
    body.appendChild(priceRow);

    card.appendChild(imgWrap);
    card.appendChild(body);

    if (urun.url && urun.url.startsWith('http')) {
      card.addEventListener('click', e => {
        if (e.target.closest('.fav-btn')) return;
        window.open(urun.url, '_blank');
      });
    }

    grid.appendChild(card);
  });
}

/* Favori ekle / çıkar */
async function toggleFav(btnEl, urun) {
  const key = urun.url || (urun.site + urun.isim);
  if (favoriMap[key]) {
    // sil
    try {
      await fetch(`/api/favoriler?device_id=${DEVICE_ID}&key=${encodeURIComponent(key)}`, { method: 'DELETE' });
      delete favoriMap[key];
      btnEl.textContent = '♡';
      btnEl.classList.remove('active');
    } catch(e) { console.error(e); }
  } else {
    // ekle
    try {
      const payload = { device_id: DEVICE_ID, ...urun };
      const res = await fetch('/api/favoriler', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      // backend dönen objeyi favoriMap'e ekle
      favoriMap[key] = { id: data.id, ...urun };
      btnEl.textContent = '♥';
      btnEl.classList.add('active');
    } catch(e) { console.error(e); }
  }
  guncelFavSayac();
  if (aktifSekme === 'favoriler') favoriGoster();
}

function guncelFavSayac() {
  const n = Object.keys(favoriMap).length;
  const el = document.getElementById('favCount');
  if (n > 0) {
    el.textContent = `♥ ${n}`;
    el.classList.remove('hidden');
  } else {
    el.classList.add('hidden');
  }
}

/* Favorileri göster */
async function favoriGoster() {
  await favoriDurumlariniYukle();
  try {
    const res = await fetch(`/api/favoriler?device_id=${DEVICE_ID}`);
    const favList = await res.json();
    document.getElementById('statusText').textContent = favList.length ? `${favList.length} favori ürün` : 'Henüz favori eklemediniz';
    renderGrid(document.getElementById('favGrid'), favList, 'favEmpty');
  } catch(e) { console.error(e); }
}

/* Sekme değiştir */
function sekmeDegistir(sekme) {
  aktifSekme = sekme;
  document.getElementById('tabArama').classList.toggle('active', sekme === 'arama');
  document.getElementById('tabFavoriler').classList.toggle('active', sekme === 'favoriler');
  document.getElementById('aramaSection').classList.toggle('hidden', sekme !== 'arama');
  document.getElementById('favorilerSection').classList.toggle('hidden', sekme !== 'favoriler');
  if (sekme === 'favoriler') favoriGoster();
}

/* Başlangıç */
(async () => {
  await favoriDurumlariniYukle();
  guncelFavSayac();
})();
</script>
</body>
</html>
